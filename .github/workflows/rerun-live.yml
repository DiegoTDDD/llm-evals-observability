name: rerun-live

# A live run spends hours on a CPU runner, and most failures are transient (a model download,
# a runner lost mid-job). Rerun the failed jobs once; a second failure stays red and is
# reported by the live run itself.
on:
  workflow_run:
    workflows: [live]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun "${{ github.event.workflow_run.id }}" --failed -R "${{ github.repository }}"
