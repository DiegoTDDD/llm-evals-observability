[project]
name = "llm-evals-observability"
version = "1.0.0"
description = "Versioned eval sets, offline regression gates and OpenTelemetry/Langfuse tracing for the sec-mcp-agent and fraud-investigation-agents projects."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "sec-mcp-agent",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["evalobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "RUF", "ANN"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/**" = ["T20"]
"evalobs/report.py" = ["E501"]  # inline CSS and HTML
